<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <title>Forestillinger</title>
  <link rel="stylesheet" href="/css/upcoming-showings.css">
</head>

<body>

<div class="admin-layout">

  <aside class="sidebar">

    <div class="logo">
      KINO
      <span>Admin</span>
    </div>

    <nav>
      <a href="#">Dashboard</a>
      <a href="movies.html">Film</a>
      <a href="upcoming-showings.html" class="active">Forestillinger</a>
      <a href="reservations.html">Reservationer</a>
      <a href="#">Salg</a>
      <a href="employees.html">Employees</a>
    </nav>

  </aside>


  <main class="main-content">

    <div class="page-header">
      <div>
        <h1>Forestillinger</h1>
        <p>Administrer biografens forestillinger</p>
      </div>
    </div>


    <!-- Opret / redigér forestilling -->
    <section class="showing-card">

      <h2>Opret forestilling</h2>

      <form id="showing-form">

        <div class="form-group">

          <label for="movie-id">Film</label>

          <select id="movie-id" required>
            <option value="">Vælg film</option>
          </select>

        </div>


        <div class="form-group">

          <label for="theatre-id">Sal</label>

          <select id="theatre-id" required>
            <option value="">Vælg sal</option>
          </select>

        </div>


        <div class="form-group">

          <label for="showing-date-time">
            Dato og tidspunkt
          </label>

          <input
                  id="showing-date-time"
                  type="datetime-local"
                  required
          >

        </div>


        <div class="form-buttons">

          <button
                  class="primary-button"
                  type="submit">
            Opret forestilling
          </button>

        </div>

      </form>

    </section>


    <!-- Alle forestillinger -->
    <section class="showing-card">

      <h2>Alle forestillinger</h2>

      <table class="showing-table">

        <thead>
        <tr>
          <th>Film</th>
          <th>Dato</th>
          <th>Tid</th>
          <th>Sal</th>
          <th>Handlinger</th>
        </tr>
        </thead>

        <tbody id="showing-table-body">
        </tbody>

      </table>

    </section>


    <!-- Kommende forestillinger -->
    <section class="showing-card">

      <h2>Kommende forestillinger</h2>

      <p class="section-description">
        Biografprogram for de næste 2 uger
      </p>

      <table class="showing-table">

        <thead>
        <tr>
          <th>Film</th>
          <th>Dato</th>
          <th>Tid</th>
          <th>Sal</th>
        </tr>
        </thead>

        <tbody id="upcoming-showing-table-body">
        </tbody>

      </table>

    </section>

  </main>

</div>


<script src="/js/upcoming-showings.js"></script>

</body>
</html>
