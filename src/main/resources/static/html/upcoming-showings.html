<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <title>Upcoming Showings</title>
  <link rel="stylesheet" href="/css/upcoming-showings.css">
</head>

<body>

<div class="admin-layout">

  -- Sidebar --
  <aside class="sidebar">

    <div class="logo">
      KINO
      <span>Admin</span>
    </div>

    <nav>
      <a href="#">Dashboard</a>
      <a href="index.html">Film</a>
      <a href="upcoming-showings.html" class="active">Forestillinger</a>
      <a href="reservations.html">Reservationer</a>
      <a href="#">Salg</a>
      <a href="employees.html">Employees</a>
    </nav>

  </aside>


  -- Main content --
  <main class="main-content">

    <div class="page-header">

      <div>
        <h1>Upcoming Showings</h1>

        <p>
          Cinema program for the next 2 weeks
        </p>
      </div>

    </div>


    -- Opret forestilling --
    <section class="showing-card">

      <h2>Opret forestilling</h2>

      <form id="showing-form">

        <label for="movie-id">Film</label>
        <select id="movie-id" required>
          <option value="">Vælg film</option>
        </select>

        <label for="theatre-id">Sal</label>
        <select id="theatre-id" required>
          <option value="">Vælg sal</option>
        </select>

        <label for="showing-date-time">
          Dato og tidspunkt
        </label>

        <input
                id="showing-date-time"
                type="datetime-local"
                required
        >

        <button type="submit">
          Opret forestilling
        </button>

      </form>

    </section>


    -- Liste over forestillinger --
    <section class="showing-card">

      <h2>Upcoming Showings</h2>

      <table id="showing-table">

        <thead>

        <tr>
    <th>Film</th>
    <th>Dato</th>
    <th>Tid</th>
    <th>Sal</th>
    <th>Handlinger</th>
</tr>

        </thead>


        <tbody id="showing-table-body">
        </tbody>

      </table>

    </section>

  </main>

</div>


<script src="/js/upcoming-showings.js"></script>

</body>
</html>
