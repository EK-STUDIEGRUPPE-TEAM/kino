<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Film</title>
</head>
<body>
<h1>Film</h1>


<h2>Opret film</h2>
<form id="addmovie" action="/api/movies/add">
    <label for="title">Titel</label>
    <input type="text" id="title" name="title">

    <label for="genre">Genre</label>
    <select id="genre" name="genre">
        <option value="SCIFI">Sci-fi</option>
        <option value="DRAMA">Drama</option>
        <option value="ACTION">Action</option>
        <option value="ROMANCE">Romantisk</option>
        <option value="HORROR">Gyser</option>
        <option value="THRILLER">Thriller</option>
        <option value="ANIMATION">Animation</option>
        <option value="COMEDY">Komedie</option>
    </select>

    <label for="ageLimit">Aldersgrænse</label>
    <input type="number" id="ageLimit" name="ageLimit">

    <label for="duration">Varighed</label>
    <input type="number" id="duration" name="duration">

    <button type="submit">Opret</button>
</form>


<table id="showMovies">
    <tr>
        <th>Titel</th>
        <th>Genre</th>
        <th>Varighed</th>
        <th>Aldersgrænse</th>
    </tr>
</table>


<script src="movie.js"></script>
</body>
</html>
