<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employees</title>
    <link rel="stylesheet" href="employee.css">
</head>
<body>

<div class="admin-layout">

    <aside class="sidebar">

        <div class="logo">
            KINO
            <span>Admin</span>
        </div>

        <nav>
            <a href="#">Dashboard</a>
            <a href="#">Film</a>
            <a href="#">Forestillinger</a>
            <a href="#">Reservationer</a>
            <a href="#">Salg</a>
            <a href="#" class="active">Employees</a>
        </nav>

    </aside>


    <main class="main-content">

        <div class="page-header">
            <div>
                <h1>Employees</h1>
                <p>Manage cinema employees</p>
            </div>
        </div>


        <section class="employee-card">

            <h2 id="employee-form-title">Add Employee</h2>

            <form id="employee-form">

                <div class="form-group">
                    <label for="employee-name">Name</label>
                    <input
                            id="employee-name"
                            type="text"
                            placeholder="Employee name"
                            required
                    >
                </div>

                <div class="form-group">
                    <label for="employee-type">Role</label>

                    <select id="employee-type">
                        <option value="SALES">Sales</option>
                        <option value="MOVIE_OPERATOR">Movie Operator</option>
                        <option value="TICKET_INSPECTOR">Ticket Inspector</option>
                    </select>
                </div>

                <div class="form-buttons">

                    <button
                            id="submit-employee-button"
                            class="primary-button"
                            type="submit">
                        Add New Employee
                    </button>

                    <button
                            id="cancel-edit-button"
                            class="secondary-button"
                            type="button"
                            hidden>
                        Cancel Edit
                    </button>

                </div>

            </form>

        </section>


        <section class="employee-card">

            <h2>Employees</h2>

            <table id="employee-table">

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Handling</th>
                </tr>
                </thead>

                <tbody id="employee-table-body">
                </tbody>

            </table>

        </section>

    </main>

</div>

<script src="employee.js?v=2"></script>

</body>
</html>
